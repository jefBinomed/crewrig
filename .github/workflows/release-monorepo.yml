name: Analyze & Release (Monorepo)

on:
  push:
    branches: [main]
    tags-ignore:
      - "**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository == 'crewrig/crewrig'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install dependencies
        run: npm install --include=dev

      # The driver sets the release commit identity itself on GitHub
      # (scripts/lib/monorepo-release-lib.sh release_identity) and reads the
      # credential from the portable key RELEASE_TOKEN (spec 0213).
      - name: Run monorepo release
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/monorepo-release.sh
